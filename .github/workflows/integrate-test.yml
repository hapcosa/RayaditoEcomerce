# Integracion automatica a la rama `test`.
#
# Cada PR abierto contra master se fusiona en `test` apenas se abre o se
# actualiza. El PR queda intacto: el merge a master lo hace el usuario.
#
# Corre en runner de GitHub (no toca el self-hosted). Los PR desde forks se
# saltan a proposito: en repos publicos el token de un fork es de solo lectura
# y ademas no queremos que codigo externo llegue a la maquina de test.
name: Integrate to test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

concurrency:
  group: integrate-test
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # El push de abajo tiene que disparar `deploy-test.yml`. Con el
          # GITHUB_TOKEN por defecto no lo hace: GitHub ignora los eventos que
          # genera ese token, para que un workflow no se dispare a si mismo en
          # bucle. Hace falta un token de usuario.
          #
          # Si el secret no esta cargado, `secrets.X` es cadena vacia y el
          # checkout falla con "Input required and not supplied: token". Caemos
          # al token por defecto para no romper la integracion de todos los PR;
          # el paso siguiente avisa que el despliegue no se va a disparar.
          token: ${{ secrets.TEST_DEPLOY_TOKEN || github.token }}

      - name: Avisar si falta el token de despliegue
        if: ${{ !secrets.TEST_DEPLOY_TOKEN }}
        run: >-
          echo "::warning::Falta el secret TEST_DEPLOY_TOKEN. Se reconstruye
          test pero el despliegue NO se dispara; hay que lanzarlo a mano con
          'gh workflow run deploy-test.yml --ref test'."

      - name: Configurar identidad de git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reconstruir `test` desde master + este PR
        run: |
          # `test` se reconstruye desde master en cada corrida. Asi nunca
          # acumula ramas viejas ni conflictos de PR ya cerrados.
          git checkout -B test origin/master
          if ! git merge --no-ff -m "ci: integrate PR #${{ github.event.pull_request.number }} into test" "origin/${{ github.event.pull_request.head.ref }}"; then
            git merge --abort
            echo "::error::El PR no fusiona limpio sobre master. Rebasea la rama."
            exit 1
          fi

      # Este push es el que dispara el despliegue: `deploy-test.yml` corre en
      # `push` a `test`. Sigue exigiendo permiso de escritura en el repo, asi
      # que el runner self-hosted continua fuera del alcance de los forks.
      - name: Publicar `test`
        run: git push --force origin test
